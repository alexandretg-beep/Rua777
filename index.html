<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rua 777</title>
  <link rel="stylesheet" href="./src/styles/game.css?v=3">
</head>
<body>
  <main class="game-shell">
    <h1>Rua 777</h1>
    <canvas id="game" width="480" height="270" aria-label="Área do jogo Rua 777"></canvas>

    <section class="touch-controls" aria-label="Controles de toque">
      <div class="touch-dpad" aria-label="Movimento">
        <button type="button" class="touch-button touch-up" data-input="ArrowUp" aria-label="Mover para cima">▲</button>
        <button type="button" class="touch-button touch-left" data-input="ArrowLeft" aria-label="Mover para esquerda">◀</button>
        <button type="button" class="touch-button touch-down" data-input="ArrowDown" aria-label="Mover para baixo">▼</button>
        <button type="button" class="touch-button touch-right" data-input="ArrowRight" aria-label="Mover para direita">▶</button>
      </div>
      <button type="button" class="touch-button touch-action" data-input="KeyE" aria-label="Interagir">E</button>
    </section>

    <p class="status">Primeira caminhada jogável</p>
    <p class="controls">Mover: WASD, setas ou toque · Interagir: E</p>
  </main>
  <script src="./src/config.js"></script>
  <script src="./src/systems/assets.js"></script>
  <script src="./src/systems/input.js?v=3"></script>
  <script src="./src/systems/collision.js"></script>
  <script src="./src/systems/dialogue.js"></script>
  <script src="./src/scenes/rua.js?v=3"></script>
  <script src="./src/entities/player.js?v=3"></script>
  <script src="./src/game.js?v=3"></script>
  <script src="./src/main.js"></script>
</body>
</html>
